{% extends "base.html" %}
{% block title %}Доступ заблокирован{% endblock %}
{% block guest_content %}
<div class="auth-screen">
    <div class="auth-card auth-card-blocked">
        <div class="auth-mark auth-mark-danger">✕</div>
        <h1>Аккаунт заблокирован</h1>
        <p class="auth-sub">
            Администратор ограничил доступ к системе для аккаунта «{{ user.username }}».
            Обратитесь к администратору, если считаете, что это ошибка.
        </p>
        <a href="{% url 'accounts:logout' %}" class="btn btn-secondary btn-block">Выйти из аккаунта</a>
    </div>
</div>
{% endblock %}
