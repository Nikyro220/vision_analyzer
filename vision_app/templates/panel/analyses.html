{% extends "base.html" %}
{% block title %}Все анализы{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Все анализы</h1>
    <p class="page-sub">Результаты анализа всех пользователей системы.</p>
</div>

<form method="get" class="filter-bar" data-filter-form onsubmit="return false;">
    <input type="search" name="q" class="input" placeholder="Поиск по имени файла…" value="{{ query }}" autocomplete="off" data-filter-field>
    <input type="search" name="user" class="input" placeholder="Поиск по пользователю…" value="{{ user_query }}" autocomplete="off" data-filter-field>
    <select name="risk" class="input" data-filter-field>
        <option value="">Любой риск</option>
        <option value="low" {% if risk_filter == "low" %}selected{% endif %}>Низкий</option>
        <option value="medium" {% if risk_filter == "medium" %}selected{% endif %}>Средний</option>
        <option value="high" {% if risk_filter == "high" %}selected{% endif %}>Высокий</option>
    </select>
    <label class="checkbox-label">
        <input type="checkbox" name="review" value="1" {% if review_only %}checked{% endif %} data-filter-field>
        Только требующие проверки
    </label>
</form>

<div id="analyses-results"
     data-list-root
     data-endpoint="{{ url_for('panel.analyses_list') }}"
     data-delete-url="{{ url_for('analyzer.delete_selected') }}">
{% include "panel/_analyses_results.html" %}
</div>
{% endblock %}

{% block scripts_extra %}
<script src="{{ url_for('static', filename='js/list-filter.js') }}"></script>
{% endblock %}
