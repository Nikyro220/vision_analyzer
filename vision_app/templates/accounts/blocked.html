{% extends "base.html" %}
{% block title %}{{ _('auth.blocked.title') }}{% endblock %}
{% block guest_content %}
<div class="auth-screen">
    <div class="auth-card auth-card-blocked">
        <div class="auth-mark auth-mark-danger">✕</div>
        <h1>{{ _('auth.blocked.heading') }}</h1>
        <p class="auth-sub">
            {{ _('auth.blocked.text', username=current_user.username) }}
            {{ _('auth.blocked.hint') }}
        </p>
        <form method="post" action="{{ url_for('accounts.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-secondary btn-block">{{ _('auth.blocked.logout') }}</button>
        </form>
    </div>
</div>
{% endblock %}
