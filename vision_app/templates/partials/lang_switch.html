{# Переключатель языка RU/EN/KZ (сегментированная кнопка). Общий для боковой панели и гостевых страниц. #}
{% set _loc = get_locale()|string %}
<div class="lang-switch" role="group" aria-label="{{ _('nav.language') }}">
    {% for code, label in LANG_LABELS.items() %}
    <a class="lang-link {% if _loc == code %}is-active{% endif %}"
       href="{{ url_for('accounts.set_language', code=code, next=request.full_path) }}"
       hreflang="{{ code }}" lang="{{ code }}"{% if _loc == code %} aria-current="true"{% endif %}>{{ label }}</a>
    {% endfor %}
</div>
